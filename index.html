<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content, viewport-fit=cover" />

    <!-- Security: Content-Security-Policy (fallback for browsers ignoring headers) -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' wss: ws: https://firebasedatabase.app https://*.firebaseio.com https://generativelanguage.googleapis.com; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self';" />
    <!-- Security: Clickjacking prevention -->
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <!-- Security: MIME sniffing prevention -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />

    <title>Instant07</title>
    <meta name="description" content="Instant07 is a modern, secure E2E platform for sharing messages and files instantly via QR codes. Zero logging, zero sign-ups, absolute privacy." />
    <meta name="theme-color" content="#0A0A0C" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Open Graph / Social Card -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Instant — Secure E2E QR Chat" />
    <meta property="og:description" content="Connect instantly with secure QR codes. Zero sign-ups, zero logging." />
    <meta property="og:image" content="/favicon.png" />

    <!-- Web App Manifest -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Instant" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <!-- Security: Frame-busting script to prevent clickjacking -->
    <script>
      if (window.self !== window.top) {
        try { window.top.location.href = window.self.location.href; }
        catch (e) { document.body.style.display = 'none'; }
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
